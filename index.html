function forecastExercise(kind,bounds){
 // Les intervalles entre deux index sont [date du premier relevé, date du second[.
 // Le jour actuel n'est pas écoulé : ne pas le compter comme couvert ou manquant.
 const today=localToday();
 // Prévoir à partir du dernier relevé effectivement disponible, pas de la date du jour.
 // Un compteur relevé le 31/10 peut ainsi être projeté en novembre sans inventer sa consommation.
 const relevantKinds=kind==='elecTotal'?['elecJour','elecNuit']:[kind];
 const lastDates=relevantKinds.map(k=>data.readings.filter(r=>r.address===address&&r.type===k&&r.date<=today&&r.date>=bounds.start).map(r=>r.date).sort().at(-1));
 const lastCommon=lastDates.every(Boolean)?lastDates.sort()[0]:bounds.start;
 const cutoff=isoDay(Math.min(dayNumber(today),dayNumber(bounds.end),dayNumber(lastCommon)));
 const current=exerciseStat(kind,bounds.start,cutoff);
 const previous=exerciseStat(kind,bounds.previousStart,bounds.previousEnd);
 const daysElapsed=dayNumber(cutoff)-dayNumber(bounds.start),daysYear=dayNumber(bounds.end)-dayNumber(bounds.start);
 const prevElapsedEnd=isoDay(Math.min(dayNumber(bounds.previousStart)+daysElapsed,dayNumber(bounds.previousEnd)));
 const previousSame=exerciseStat(kind,bounds.previousStart,prevElapsedEnd);
 const remaining=exerciseStat(kind,prevElapsedEnd,bounds.previousEnd);
 const fullCurrent=current&&current.covered===daysElapsed&&daysElapsed>0;
 const fullPrevious=previous&&previous.covered===daysYear;
 const fullSame=previousSame&&previousSame.covered===daysElapsed;
 const fullRemaining=remaining&&remaining.covered===daysYear-daysElapsed;
 // Autoriser de petites lacunes (maximum 5 % et 7 jours par segment).
 // Les quantités des intervalles partiellement couverts sont ramenées à leur durée totale.
 const adjusted=(stat,days)=>{
  if(!stat||!stat.covered||!days)return null;
  const missing=days-stat.covered;
  if(missing<0||missing>7||missing/days>0.05)return null;
  return {quantity:stat.quantity*days/stat.covered,missing};
 };
 const a=adjusted(current,daysElapsed);
 const c=adjusted(remaining,daysYear-daysElapsed);
 let forecast=null,method='';
 if(a&&c){
  // Prévision transparente, sans coefficient lié aux semaines ou mois récents :
  // consommation déjà constatée + consommation historique des mêmes dates restantes.
  forecast=a.quantity+c.quantity;
  method='Prévision = consommation de l’exercice en cours ('+fmt(a.quantity)+' '+(kind==='elecTotal'?'kWh':TYPES[kind][1])+') + consommation historique sur les dates restantes de l’exercice précédent ('+fmt(c.quantity)+' '+(kind==='elecTotal'?'kWh':TYPES[kind][1])+'). Aucun coefficient de tendance récente n’est appliqué.';
  const missing=Math.max(a.missing,c.missing);
  if(missing)method+=' Certaines journées non couvertes (jusqu’à '+missing+') sont estimées au prorata des relevés disponibles.';
  method+=' La météo et l’occupation futures peuvent différer de l’année précédente. La projection ne nécessite pas une couverture complète de l’exercice précédent : seule la période historique correspondant aux jours restants est requise.';
 }
 return {current,previous,forecast,method,daysElapsed,daysYear,fullCurrent,fullPrevious,cutoff};
}

function dashboard(){

 }).join('');
 const alerts=latestConsumptionAlerts(address);const alertSection=alerts.map(x=>'<p><strong>'+esc(TYPES[x.type][0])+' — relevé du '+x.date+'</strong></p>'+alertMarkup(x.alert)).join('');

function electricitySegments(kind){
 const rr=data.readings.filter(r=>r.address===address&&r.type===kind).sort((a,b)=>a.date.localeCompare(b.date));
 const segments=[];
 for(let i=1;i<rr.length;i++){
  const a=rr[i-1],b=rr[i],days=dayNumber(b.date)-dayNumber(a.date),qty=b.value-a.value;
  if(days>0&&qty>=0)segments.push({from:dayNumber(a.date),to:dayNumber(b.date),daily:qty/days});
 }
 return segments;
}
function electricityCalculation(start,end){
 const from=dayNumber(start),to=dayNumber(end);if(!(to>from))return null;
 // Les compteurs jour et nuit sont intégrés indépendamment sur les mêmes dates.
 // Les jours non couverts sont signalés, jamais remplacés par zéro sans avertissement.
 const count=(kind)=>{let quantity=0,covered=0;for(const seg of electricitySegments(kind)){
  const overlap=Math.max(0,Math.min(to,seg.to)-Math.max(from,seg.from));
  if(overlap>0){quantity+=overlap*seg.daily;covered+=overlap}
 }return {quantity,covered};};
 const a=count('elecJour'),b=count('elecNuit');
 return {day:a.quantity,night:b.quantity,total:a.quantity+b.quantity,dayCovered:a.covered,nightCovered:b.covered,covered:Math.min(a.covered,b.covered),requested:to-from};
}

}// Alertes de consommation : comparaison des mêmes jours de l'année précédente.
// Une année bissextile peut déplacer les bornes d'un jour ; les dates sont ajustées.
const CONSUMPTION_LIMITS={eau:25,elecJour:30,elecNuit:30,gaz:20,chauffage:20};
const MIN_REFERENCE={eau:0.1,elecJour:2,elecNuit:2,gaz:0.5,chauffage:2};
const HEATING_MAX_REFERENCE_INTERVAL=60;
function priorYearDate(iso){
 const [y,m,d]=iso.split('-').map(Number);
 const x=new Date(Date.UTC(y-1,m-1,d));
 if(x.getUTCMonth()!==m-1)x.setUTCDate(0);
 return x.toISOString().slice(0,10);
}
function consumptionAlert(home,type,date,value,excludeId=null){
 if(!(type in CONSUMPTION_LIMITS))return null;
 const rows=data.readings.filter(r=>r.address===home&&r.type===type&&String(r.id)!==String(excludeId??'')&&r.date).sort((a,b)=>a.date.localeCompare(b.date));
 const previous=rows.filter(r=>r.date<date).at(-1);
 if(!previous)return null;
 const days=dayNumber(date)-dayNumber(previous.date),delta=value-Number(previous.value);
 if(days<7||delta<0)return null; // Intervalles trop courts ou index incohérents.
 const oldStart=priorYearDate(previous.date),oldEnd=priorYearDate(date);
 const oldDays=dayNumber(oldEnd)-dayNumber(oldStart);
 if(oldDays<1)return null;
 // Recalcul sur les intervalles existants, sans extrapoler les périodes sans relevés.
 let quantity=0,covered=0,maxReferenceInterval=0;
 for(const p of seasonalIntervals(home,type)){
  const overlap=Math.max(0,Math.min(dayNumber(oldEnd),p.end)-Math.max(dayNumber(oldStart),p.start));
  if(overlap>0){quantity+=p.delta*overlap/p.days;covered+=overlap;maxReferenceInterval=Math.max(maxReferenceInterval,p.days)}
 }
 const missing=oldDays-covered;
 if(!covered||missing>7||missing/oldDays>0.05||quantity<MIN_REFERENCE[type])return null;
 const historicalDaily=quantity/covered,currentDaily=delta/days;
 if(historicalDaily<=0)return null;
 const rise=(currentDaily/historicalDaily-1)*100;
 if(rise<CONSUMPTION_LIMITS[type])return null;
 return {rise,days,currentDaily,historicalDaily,limit:CONSUMPTION_LIMITS[type],type,oldStart,oldEnd,maxReferenceInterval,indicative:type==='chauffage'&&maxReferenceInterval>HEATING_MAX_REFERENCE_INTERVAL};
}

// Contrôle chronologique des index, avant chaque insertion ou modification.
// Le niveau de cuve mazout n'est pas un index cumulatif : il peut diminuer normalement.
function indexAnomalies(home,type,date,value,excludeId=null){
 if(type==='mazout')return [];
 const rows=data.readings.filter(r=>r.address===home&&r.type===type&&String(r.id)!==String(excludeId??'')&&r.date).sort((a,b)=>a.date.localeCompare(b.date));
 const same=rows.filter(r=>r.date===date);
 const previous=rows.filter(r=>r.date<date).at(-1);
 const next=rows.find(r=>r.date>date);
 const problems=[];
 if(same.length)problems.push('Un relevé existe déjà le '+date+' pour ce compteur.');
 if(previous&&value<Number(previous.value))problems.push('Index saisi : '+fmt(value)+' '+TYPES[type][1]+' ; précédent : '+fmt(previous.value)+' '+TYPES[type][1]+' le '+previous.date+'.');
 if(next&&value>Number(next.value))problems.push('Index saisi : '+fmt(value)+' '+TYPES[type][1]+' ; relevé suivant : '+fmt(next.value)+' '+TYPES[type][1]+' le '+next.date+'.');
 return problems;
}

const seasonDates={summerStart:'2026-05-01',summerEnd:'2026-09-30',winterStart:'2026-10-01',winterEnd:'2027-04-30'};
const localToday=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const dayNumber=d=>{const [y,m,day]=d.split('-').map(Number);return Date.UTC(y,m-1,day)/86400000};
function seasonalIntervals(addr,type){
 const rr=data.readings.filter(x=>x.address===addr&&x.type===type).sort((a,b)=>a.date.localeCompare(b.date));let out=[];
 for(let i=1;i<rr.length;i++){
  const start=rr[i-1],end=rr[i],days=dayNumber(end.date)-dayNumber(start.date);if(days<=0)continue;
  let delta=end.value-start.value;
  if(type==='mazout')delta=-delta+data.deliveries.filter(x=>x.address===addr&&x.date>start.date&&x.date<=end.date).reduce((sum,x)=>sum+x.litres,0);
  if(delta<0)continue;
  out.push({start:dayNumber(start.date),end:dayNumber(end.date),days,delta});
 }return out;
}
function seasonStats(addr,type,start,end){
 if(!start||!end||dayNumber(end)<dayNumber(start))return null;
 const today=localToday();
 const from=dayNumber(start),to=Math.min(dayNumber(end),dayNumber(today))+1,requested=Math.max(0,to-from);
 if(requested===0)return {quantity:0,covered:0,requested:0,avg:null};
 let quantity=0,covered=0;
 for(const p of seasonalIntervals(addr,type)){
  const overlap=Math.max(0,Math.min(to,p.end)-Math.max(from,p.start));
  if(overlap>0){quantity+=p.delta*overlap/p.days;covered+=overlap}
 }
 return {quantity,covered,requested,avg:covered?quantity/covered:null};
}

// Comparaison du chauffage : hiver précédent complet, été complet, hiver actuel et projection saisonnière.
function heatingWinterComparison(){
 if(address!=='chauve')return '';
 const now=localToday(),type='chauffage',unit=TYPES[type][1];
 const ws=seasonDates.winterStart,we=seasonDates.winterEnd;
 const ss=seasonDates.summerStart,se=seasonDates.summerEnd;
 if(!ws||!we||!ss||!se||ws>we||ss>se)return '<div class="panel"><p class="notice">Dates saisonnières invalides.</p></div>';
 const shift=(iso,years)=>historicDate(iso,years);
 const prevStart=shift(ws,1),prevEnd=shift(we,1);
 const previous=seasonStats(address,type,prevStart,prevEnd);
 const summer=seasonStats(address,type,ss,se);
 const readings=data.readings.filter(r=>r.address===address&&r.type===type&&r.date>=ws&&r.date<=now).sort((a,b)=>a.date.localeCompare(b.date));
 const last=readings.length?readings[readings.length-1].date:null;
 const actualEnd=last&&last<we?last:we;
 const current=last&&last>=ws?seasonStats(address,type,ws,actualEnd):null;
 const prevDays=dayNumber(prevEnd)-dayNumber(prevStart)+1;
 const summerDays=dayNumber(se)-dayNumber(ss)+1;
 const actualDays=actualEnd&&actualEnd>=ws?dayNumber(actualEnd)-dayNumber(ws)+1:0;
 const coverage=(r,days)=>days>0?(r?.covered||0)/days:0;
 const prevOk=coverage(previous,prevDays)>=0.95;
 const summerOk=se<=now&&coverage(summer,summerDays)>=0.95;

 if(end>now)notes.push('la période se poursuit dans le futur (calcul limité à aujourd’hui)');

// Déplace une date vers une année historique en respectant les fins de mois (29 février inclus).
function historicDate(iso,yearsBack){
 const [y,m,d]=iso.split('-').map(Number);
 const targetYear=y-yearsBack;
 const lastDay=new Date(Date.UTC(targetYear,m,0)).getUTCDate();
 return [targetYear,String(m).padStart(2,'0'),String(Math.min(d,lastDay)).padStart(2,'0')].join('-');
}
// Dates de comparaison : mois/année/saison historiques complets ; période courante arrêtée au dernier relevé.
function historicPeriodBounds(start,end,preset,n,now){
 let referenceEnd=end;
 if(preset==='year')referenceEnd=start.slice(0,4)+'-12-31';
 else if(preset==='month'){
  const [y,m]=start.split('-').map(Number);
  referenceEnd=[y,String(m).padStart(2,'0'),String(new Date(Date.UTC(y,m,0)).getUTCDate()).padStart(2,'0')].join('-');
 }
 return {from:historicDate(start,n),to:historicDate(referenceEnd,n)};
}
function lastMeterReading(kind){
 const types=kind==='elecTotal'?['elecJour','elecNuit']:[kind];
 const dates=types.map(type=>data.readings.filter(r=>r.address===address&&r.type===type).map(r=>r.date).sort().at(-1)).filter(Boolean);
 // Pour le total jour+nuit, la limite commune évite d'additionner deux durées différentes.

}
function historicalComparison(kind,start,end,mode,now,preset){
 const firstYears=data.readings.filter(r=>r.address===address&&(
  kind==='elecTotal'?['elecJour','elecNuit'].includes(r.type):r.type===kind
 )).map(r=>Number(r.date.slice(0,4)));
 const oldest=firstYears.length?Math.min(...firstYears):Number(start.slice(0,4));
 const maxBack=mode==='previous'?1:mode==='five'?5:Math.max(0,Number(start.slice(0,4))-oldest);
 const last=lastMeterReading(kind);
 const rows=[];
 for(let n=0;n<=maxBack;n++){
  const bounds=historicPeriodBounds(start,end,preset,n,now);
  const ongoing=n===0&&bounds.to>now;
  const plannedEnd=bounds.to;
  // Un mois ou une année courante est en cours même si le bouton fixe « Au » à aujourd'hui.
  const isCurrentIncomplete=n===0&&plannedEnd>=now;
  const to=isCurrentIncomplete?(!last?null:[plannedEnd,now,last].sort()[0]):plannedEnd;
  const from=bounds.from;
  const requested=to&&to>=from?dayNumber(to)-dayNumber(from)+1:0;
  const result=requested?periodQuantity(kind,from,to):null;
  const covered=result?.covered||0;
  const quantity=result?.quantity||0;
  const adequate=requested>0&&covered/requested>=0.95;
  rows.push({n,from,to,plannedEnd,ongoing:isCurrentIncomplete,requested,covered,quantity,

 <div class="entry-form"><div><label>Période 1 — du</label><input id="periodCompare1Start" type="date" value="${period1Start}"></div><div><label>Période 1 — au</label><input id="periodCompare1End" type="date" value="${period1End}"></div></div>
 <div class="entry-form"><div><label>Période 2 — du</label><input id="periodCompareStart" type="date" value="${compareStart}"></div><div><label>Période 2 — au</label><input id="periodCompareEnd" type="date" value="${compareEnd}"></div><button type="button" onclick="setPeriodOptions()">Comparer</button></div>
 ${v.compare?(!valid1||!valid2?'<p class="notice">Dates invalides : vérifie les quatre dates. Une date de début ne peut dépasser la date de fin et une période ne peut commencer dans le futur.</p>':aCompare?.covered&&b?.covered?`${bar('Période 1',aCompare,'#2563eb')}${bar('Période 2',b,'#f59e0b')}<p><strong>Écart des consommations couvertes :</strong> ${diff===null?'—':fmt(diff,1)+' %'} ; <strong>écart des moyennes quotidiennes :</strong> ${dailyDiff===null?'—':fmt(dailyDiff,1)+' %'}</p><p class="muted">Pour comparer équitablement des périodes de durées différentes, compare les moyennes : période 1 ${fmt(aCompare.quantity/aCompare.covered)} ${unit}/jour ; période 2 ${fmt(b.quantity/b.covered)} ${unit}/jour.</p>${compareCoverage('Période 1',aCompare,period1Start,period1End,now)}${compareCoverage('Période 2',b,compareStart,compareEnd,now)}`:'<p class="notice">Données insuffisantes pour une comparaison : il faut des relevés encadrant chacune des périodes.</p>'):'<p class="muted">Active la comparaison personnalisée pour utiliser ces dates.</p>'}</div></div>
 ${seasonComparison&&kind==='chauffage'?heatingWinterComparison():''}${seasonTable}\n <div class="panel"><details><summary style="cursor:pointer;font-weight:700">Historique détaillé des intervalles entre relevés — ${esc(relevant().name)}</summary><div class="scroll"><table><tr><th>Compteur</th><th>Du</th><th>Au</th><th>Consommation</th><th>Jours</th></tr>${relevant().meters.flatMap(k=>periods(k).map(p=>`<tr><td>${TYPES[k][0]}</td><td>${p.from}</td><td>${p.to}</td><td>${fmt(p.delta)} ${TYPES[k][1]}</td><td>${p.days}</td></tr>`)).join('')}</table></div></details></div>`;
}

function comparisonsPage(){return seasonalPage()+`<div class="panel"><h2>Comparaisons des consommations</h2><p class="muted">Moyenne sur toute la période mesurée. Comparaison par type de compteur ; les unités différentes ne sont pas additionnées.</p><div class="scroll"><table><tr><th>Adresse</th><th>Compteur</th><th>Jours</th><th>Consommation</th><th>Moyenne/jour</th></tr>${ADDRESSES.flatMap(a=>a.meters.map(k=>{let old=address;address=a.id;let s=meterSummary(k);address=old;return `<tr><td>${a.name}</td><td>${TYPES[k][0]}</td><td>${s?s.days:'—'}</td><td>${s?fmt(s.delta)+' '+TYPES[k][1]:'—'}</td><td>${s?fmt(s.avg):'—'}</td><td>${s?fmt(s.annual):'—'}</td></tr>`})).join('')}</table></div></div><div class="panel"><h3>Périodes entre relevés — ${relevant().name}</h3><div class="scroll"><table><tr><th>Compteur</th><th>Du</th><th>Au</th><th>Consommation</th><th>Jours</th></tr>${relevant().meters.flatMap(k=>periods(k).map(p=>`<tr><td>${TYPES[k][0]}</td><td>${p.from}</td><td>${p.to}</td><td>${fmt(p.delta)} ${TYPES[k][1]}</td><td>${p.days}</td></tr>`)).join('')}</table></div></div>`}
function backupPage(){return `<div class="panel"><h2>Export de sécurité</h2><p>Les données sont conservées dans Supabase. Tu peux télécharger une copie JSON à tout moment. L'import automatique n'est pas encore disponible.</p><button class="primary" type="button" onclick="exportData()">Exporter une copie JSON</button></div>`}
let pendingAction=null;
const FIELD_LABELS={type:'Compteur',date:'Date',value:'Index',litres:'Litres livrés',amount:'Montant (€)',from:'Début de période',to:'Fin de période'};
function editItem(k,id){if(!canEdit())return;pendingAction={mode:'edit',k,id};render();document.getElementById('editPanel')?.scrollIntoView({behavior:'smooth',block:'center'})}
function removeItem(k,id){if(!canEdit())return;pendingAction={mode:'delete',k,id};render();document.getElementById('editPanel')?.scrollIntoView({behavior:'smooth',block:'center'})}
function cancelAction(){pendingAction=null;render()}
function actionPanel(){
 if(!pendingAction)return '';
 const {mode,k,id}=pendingAction,x=data[k].find(v=>v.id===id);
 if(!x){pendingAction=null;return ''}
 if(mode==='delete')return `<div class="panel" id="editPanel" style="border:2px solid #bf3e3e"><h3>Confirmer la suppression</h3><p>Supprimer définitivement l'enregistrement du ${esc(x.date)} ?</p><button class="danger" type="button" onclick="confirmDelete()">Oui, supprimer</button> <button type="button" onclick="cancelAction()">Annuler</button></div>`;
 let fields=k==='readings'?['type','date','value']:k==='deliveries'?['date','litres','amount']:['type','date','from','to','amount'];
 return `<div class="panel" id="editPanel" style="border:2px solid #17689a"><h3>Modifier un enregistrement</h3><form id="editForm">${fields.map(f=>f==="type"?`<div><label>Compteur</label><select name="type">${k==='invoices'?invoiceTypeOptions(x.type==='elecNuit'?'elecJour':x.type):ADDRESSES.find(a=>a.id===x.address).meters.map(t=>`<option value="${t}" ${x.type===t?"selected":""}>${TYPES[t][0]} (${TYPES[t][1]})</option>`).join("")}</select></div>`:`<div><label>${FIELD_LABELS[f]}</label><input name="${f}" type="${['date','from','to'].includes(f)?'date':'number'}" ${['value','litres','amount'].includes(f)?'step="any" min="0"':''} value="${esc(x[f]??'')}" ${['date','value','litres','amount'].includes(f)?'required':''}></div>`).join('')}<button class="primary" type="button" onclick="saveEditDirect()">Enregistrer les modifications</button><button type="button" onclick="cancelAction()">Annuler</button></form></div>`
}
async function confirmDelete(){if(!pendingAction||pendingAction.mode!=='delete')return;const {k,id}=pendingAction;try{const table={readings:'readings',invoices:'financial_entries',deliveries:'oil_deliveries'}[k];await mutate(table,'DELETE',null,id);pendingAction=null;render();notify('✓ Suppression enregistrée dans Supabase')}catch(e){showError(e)}}
async function saveEditDirect(){const form=$('editForm');if(!form){notify('Formulaire introuvable',true);return}if(!form.reportValidity())return;if(!pendingAction)return;
 const {k,id}=pendingAction,x=data[k].find(v=>v.id===id);if(!x)return;const f=new FormData(form);
 try{let table,payload;if(k==='readings'){table='readings';payload={meter_id:meters[x.address+':'+f.get('type')].id,reading_date:f.get('date'),reading_value:Number(f.get('value'))}}
 else if(k==='deliveries'){table='oil_deliveries';payload={delivery_date:f.get('date'),liters:Number(f.get('litres')),amount_eur:Number(f.get('amount'))}}
 else{table='financial_entries';payload={meter_id:meters[x.address+':'+f.get('type')].id,entry_date:f.get('date'),period_start:f.get('from')||null,period_end:f.get('to')||null,amount_eur:Number(f.get('amount'))}}
 if(k==='readings'&&!checkReadingIndex(x.address,String(f.get('type')),String(f.get('date')),Number(f.get('value')),id,form))return;
 if(k==='readings'&&!checkConsumptionAlert(x.address,String(f.get('type')),String(f.get('date')),Number(f.get('value')),id,form))return;
 if(payload.period_start&&payload.period_end&&payload.period_start>payload.period_end)throw Error('Période invalide');await mutate(table,'PATCH',payload,id);pendingAction=null;render();notify('✓ Modifications enregistrées dans Supabase')
 }catch(e){showError(e)}}
function exportData(){let b=new Blob([JSON.stringify({version:1,...data},null,2)],{type:'application/json'}),u=window.URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='mes-consommations-'+today()+'.json';a.click();setTimeout(()=>window.URL.revokeObjectURL(u),500)}
async function restoreSession(){
 let saved=null;try{saved=JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch(e){}
 if(!saved?.refresh_token)return;
 session=saved;
 $('loginStatus').textContent='Restauration de la session…';
 try{await ensureSession();await loadAll();if($('appArea').hidden)$('loginStatus').textContent='Session retrouvée, mais chargement des données impossible.'}
 catch(e){session=null;persistSession();$('loginStatus').textContent='Session expirée. Reconnecte-toi.'}
}
$('storageStatus').textContent='Connexion à Supabase…';
restoreSession();
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(e=>console.warn('Service worker indisponible',e)));}</script></body></html>
